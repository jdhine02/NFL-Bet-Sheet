<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--dim:#6b7280;--bd:#e0e4ed;--cond:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#f5f6fa;padding:16px;font-size:13px}
.hdr{background:linear-gradient(135deg,var(--navy),#173a63);color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:12px}
.htitle{font-family:var(--cond);font-size:24px;font-weight:800}

.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.tab-link{padding:6px 14px;border-radius:6px 6px 0 0;font-weight:600;font-size:12px;
border:1px solid var(--bd);border-bottom:none;background:#e8eaf0;color:var(--dim);
text-decoration:none;display:inline-block;font-family:var(--cond)}
.tab-link.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab-link:hover:not(.active){background:var(--navy);color:#fff;opacity:.8}

.sec{font-family:var(--cond);font-size:17px;font-weight:800;color:var(--navy);margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--bd)}
table{border-collapse:collapse;width:100%}
th{background:#eef1f7;color:var(--dim);font-size:9px;text-transform:uppercase;padding:6px;text-align:left}
td{padding:6px;border-bottom:1px solid var(--bd);font-size:11px;vertical-align:middle}
.tbl-wrap{background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow-x:auto}
.mono{font-family:var(--mono)}.navy{color:var(--navy)}.c{text-align:center}.tl{white-space:normal}
.combo-prob{background:#e9edfb;border-radius:6px;padding:8px 12px;font-size:12px;margin-bottom:16px}
</style></head><body>
<div class="hdr"><div class="htitle">NFL Bet Sheet - Parlays</div></div>
<div class="tabs"><a href="index.html" class="tab-link">Top Props</a><a href="tab1.html" class="tab-link active">Parlays</a><a href="tab2.html" class="tab-link">TNF</a><a href="tab3.html" class="tab-link">Early Slate</a><a href="tab4.html" class="tab-link">Late Slate</a><a href="tab5.html" class="tab-link">SNF</a><a href="tab6.html" class="tab-link">MNF</a><a href="tab7.html" class="tab-link">Injuries</a><a href="tab8.html" class="tab-link">Results</a></div>
<div class="tbl-wrap" style="padding:20px;text-align:center;color:var(--dim)">No real legs cleared the rating threshold this week.</div>
<div class="sec">Same-Game Parlays (real yds+td pairs, correlation-adjusted)</div>
<div class="tbl-wrap"><table><tr><th>Player</th><th title="Assumes independence -- wrong for same-player legs">Naive Prob</th>
<th title="Uses the real measured yds-vs-td correlation">Real Prob</th><th>Difference</th><th>Correlation</th></tr>
<tr><td colspan=5 style="text-align:center;color:var(--dim);padding:16px">No real graded yds+td pairs found this week.</td></tr></table></div>
</body></html>
