<!DOCTYPE html><html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="../Logos/apple-touch-icon.png">
<meta name="theme-color" content="#0B2545">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--dim:#6b7280;--bd:#e0e4ed;--green:#1a7a3a;--gold:#C8960C;--cond:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#f5f6fa;padding:10px;font-size:17px}
.hdr{background:linear-gradient(135deg,var(--navy),#173a63);color:#fff;padding:12px 14px;border-radius:10px;margin-bottom:10px}
.htitle{font-family:var(--cond);font-size:19px;font-weight:800}
.hsub{font-size:10px;opacity:.85;margin-top:2px}
.team{color:#fff;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700}
.pos{display:inline-block;border-radius:3px;padding:1px 5px;font-size:9px;font-weight:700}
.pos-qb{background:#dbeafe;color:#1e40af}.pos-rb{background:#dcfce7;color:#166534}.pos-wr{background:#fef9c3;color:#854d0e}.pos-te{background:#ede9fe;color:#5b21b6}
.grade{display:inline-block;padding:4px 10px;border-radius:5px;font-size:16px;font-weight:800;color:#fff}
.badge{display:inline-block;font-size:8px;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:.3px;margin-left:4px}
.badge.lock{background:var(--gold);color:#fff}
.badge.value{background:var(--green);color:#fff}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.rating-chip{border-radius:8px;padding:6px;text-align:center;margin-bottom:8px;color:#fff;display:inline-block;min-width:56px}
.rating-num{font-family:var(--cond);font-size:20px;font-weight:800}
.rating-lbl{font-size:8px;font-weight:700;text-transform:uppercase;opacity:.9}
.mstat-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.mstat-line{font-family:var(--mono);color:var(--navy);font-weight:800;font-size:14px}
.mstat-x{font-family:var(--mono);font-size:13px;color:#374151}
.mstat-edge{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}
.prank{font-family:var(--cond);font-size:22px;font-weight:900;color:var(--navy);min-width:26px;display:inline-block}
details{background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-family:var(--cond);font-weight:800;font-size:15px;color:var(--navy)}
summary::-webkit-details-marker{display:none}
summary .chev{transition:transform .15s ease;color:var(--dim);font-size:12px}
details[open] summary .chev{transform:rotate(90deg)}
details[open] summary{border-bottom:1px solid var(--bd)}
.details-body{padding:12px}
.section-count{font-family:var(--body);font-weight:600;font-size:10px;color:#fff;background:var(--navy);border-radius:10px;padding:1px 8px;margin-left:6px}
.note{font-size:10px;color:var(--dim);margin-bottom:10px;text-align:center}
.tbd{color:#9ca3af}


body{padding-bottom:64px}
.mnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--bd);
box-shadow:0 -2px 8px rgba(0,0,0,.08);z-index:100}
.mnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px;
text-decoration:none;color:var(--dim);font-size:9px;font-weight:700;gap:2px}
.mnav a .micon{font-size:18px}
.mnav a.active{color:var(--navy)}


.mcard{background:#f8f9fc;border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
.mcard:last-child{margin-bottom:0}
.mcard-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.mstat{margin-bottom:8px}.mstat:last-child{margin-bottom:0}
.mstat-label{font-family:var(--cond);font-weight:800;color:var(--navy);font-size:11px;min-width:60px}
.mstat-graph svg{width:100%;height:auto}
.mstat-graph-row{display:flex;align-items:center;gap:12px}
.mstat-graph{flex:0 0 auto}
.mstat-rate{flex:1;text-align:center;border-left:1px solid var(--bd);padding-left:12px;min-width:60px}
.rate-val{font-family:var(--cond);font-size:22px;font-weight:800;color:var(--navy);line-height:1.1}
.rate-lbl{font-size:12.5px;color:var(--dim);text-transform:uppercase;font-weight:700}
.tstat-table{width:100%;border-collapse:collapse;margin-bottom:4px;font-size:11px}
.tstat-table th{font-size:8px;color:var(--dim);text-transform:uppercase;padding:4px;text-align:center}
.tstat-table td{padding:5px 4px;text-align:center;font-family:var(--mono)}
.tstat-table .tl{text-align:left;font-family:var(--body)}
.game-box{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:0;margin-bottom:14px;overflow:hidden}
.game-box summary{cursor:pointer;list-style:none;padding:12px;background:linear-gradient(180deg,#ffffff,#e0e2e6);color:var(--navy);display:flex;align-items:center;justify-content:space-between}
.game-box summary::-webkit-details-marker{display:none}
.game-box summary::before{content:"\25B6";display:inline-block;margin-right:8px;font-size:11px;transition:transform .15s}
.game-box[open] summary::before{transform:rotate(90deg)}
.game-box-body{background:linear-gradient(180deg,#ffffff,#e5e7eb);padding:10px}
.cell-hl-m{display:inline-block;border-radius:5px;padding:3px 9px;font-weight:800;font-family:var(--mono);color:#fff;font-size:13px}
.prop-section summary{background:#4A6FA5;color:#fff;border-radius:6px}
.prop-section summary .section-count{color:#fff;opacity:.85}
.prop-section summary .chev{color:#fff}
.prop-section[open] summary{border-radius:6px 6px 0 0;border-bottom:none}

</style></head><body>
<div class="hdr"><div class="htitle">📊 Results</div></div>
<details class="prop-section" open>
  <summary>Record by Prop Type <span class="chev">▶</span></summary>
  <div class="details-body"><div class="tbd">No real graded picks yet.</div></div>
</details>
<details class="prop-section" open>
  <summary>Recent Individual Picks <span class="chev">▶</span></summary>
  <div class="details-body"><div class="tbd">No real graded picks yet -- populates once picks are locked and their games complete.</div></div>
</details>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js');}</script>
</body></html>
