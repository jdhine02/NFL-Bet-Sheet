<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--dim:#6b7280;--bd:#e0e4ed;--gold:#C8960C;--green:#1a7a3a;--cond:'Barlow Condensed',sans-serif;--mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:#f5f6fa;padding:16px;font-size:17px;max-width:1650px;margin:0 auto}
.hdr{background:linear-gradient(135deg,var(--navy),#173a63);color:#fff;padding:12px 16px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.htitle{font-family:var(--cond);font-size:26px;font-weight:800}
.logo-chip{display:inline-flex;align-items:center;justify-content:center;background:transparent;vertical-align:middle}
.logo-chip img{display:block;height:24px;width:auto;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.9)) drop-shadow(0 0 1px rgba(255,255,255,.9))}
.logo-pair{display:inline-flex;align-items:center;gap:8px;vertical-align:middle}

.tabs{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}
.nav-logo{height:12px;width:auto;vertical-align:middle;margin-right:4px;filter:drop-shadow(0 0 0.5px rgba(0,0,0,.3))}
.tab-link{padding:6px 14px;border-radius:6px 6px 0 0;font-weight:600;font-size:12px;
border:1px solid var(--bd);border-bottom:none;background:#e8eaf0;color:var(--dim);
text-decoration:none;display:inline-block;font-family:var(--cond)}
.tab-link.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tab-link:hover:not(.active){background:var(--navy);color:#fff;opacity:.8}


.bb-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.bb-card{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:10px}
.bb-label{font-family:var(--cond);font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;margin-bottom:4px}
.bb-player{font-weight:700;font-size:14px;margin-bottom:4px}
.bb-line{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;margin-bottom:2px}
.bb-edge{font-size:11px;color:var(--green,#1a7a3a);font-weight:700}
.bb-empty{color:var(--dim);font-size:12px;padding:8px 0}
.wx{background:#e9edfb;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:14px;display:inline-block}
.sec{background:linear-gradient(135deg,var(--navy),#1a3a63);color:#fff;border-radius:8px;padding:8px 14px;margin:22px 0 10px;font-family:var(--cond);font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
table{border-collapse:collapse;width:100%}
th{background:#eef1f7;color:var(--dim);font-size:12px;text-transform:uppercase;padding:8px 9px;text-align:center;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bd);font-size:15px;white-space:nowrap;vertical-align:middle;text-align:center}
.tbl-wrap{background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow-x:auto}
.mono{font-family:var(--mono)}.navy{color:var(--navy)}.c{text-align:center}.r{text-align:right}.tl{white-space:normal;text-align:left}
.pos{display:inline-block;border-radius:3px;padding:3px 7px;font-size:12px;font-weight:700;margin-left:4px}
.pos-qb{background:#dbeafe;color:#1e40af}.pos-rb{background:#dcfce7;color:#166534}.pos-wr{background:#fef9c3;color:#854d0e}.pos-te{background:#ede9fe;color:#5b21b6}
.grade{display:inline-block;padding:4px 10px;border-radius:5px;font-size:16px;font-weight:800;color:#fff}
.cell-hl{display:inline-block;border-radius:5px;padding:4px 10px;font-weight:800;font-family:var(--mono);color:#fff;font-size:15px}
.lock-badge{display:inline-block;background:var(--gold,#C8960C);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:4px}
.value-badge{display:inline-block;background:var(--green,#1a7a3a);color:#fff;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:4px}
.subsec{background:#4A6FA5;color:#fff;font-family:var(--cond);font-size:16px;font-weight:800;padding:7px 14px;border-radius:6px;margin:14px 0 7px}
.team-stat-grid{width:100%;border-collapse:collapse;margin-bottom:8px}
.team-stat-grid th{background:#f8f9fc}
.team-best{color:#fff!important;font-weight:700}

.game-box{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:0;margin-bottom:24px;box-shadow:0 2px 8px rgba(11,37,69,.08);overflow:hidden}
.game-box summary{cursor:pointer;list-style:none;padding:16px}
.game-box summary::-webkit-details-marker{display:none}
.game-box summary::before{content:"\25B6";display:inline-block;margin-right:8px;font-size:11px;transition:transform .15s;vertical-align:middle}
.game-box[open] summary::before{transform:rotate(90deg)}
.game-box-body{padding:0 16px 16px}
</style></head><body>
<div id="spark-tip" style="position:fixed;display:none;background:#1a1d2e;padding:5px 9px;border-radius:5px;
font-size:10px;font-family:var(--mono);pointer-events:none;z-index:9999;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.35)"></div>
<script>
function _positionTip(t,evt){
  // real fix 8/20/26: was always placed at clientX+12 with no viewport
  // check -- confirmed live on mobile, bars in the right half of the
  // screen (esp. narrow phone widths) pushed the box off-screen, cut off
  // mid-text. Now measures the box after filling it in and flips to the
  // LEFT of the cursor whenever the default right-side placement would
  // overflow the window, same real logic top/bottom.
  var pad = 8;
  var left = evt.clientX + 12;
  var top = evt.clientY - 28;
  var rect = t.getBoundingClientRect();
  if (left + rect.width + pad > window.innerWidth) left = evt.clientX - rect.width - 12;
  if (left < pad) left = pad;
  if (top < pad) top = evt.clientY + 16;
  if (top + rect.height + pad > window.innerHeight) top = window.innerHeight - rect.height - pad;
  t.style.left = left + 'px'; t.style.top = top + 'px';
}
function showTip(evt,label,val,opp,date,over){
  var t=document.getElementById('spark-tip');
  var color = over==='true' ? '#4ade80' : '#f87171';
  t.innerHTML = '<span style="color:#9ca3af">'+date+' vs '+opp+'</span><br><span style="color:'+color+';font-weight:700">'+label+': '+val+'</span>';
  t.style.display='block';
  _positionTip(t,evt);
}
function moveTip(evt){ _positionTip(document.getElementById('spark-tip'),evt); }
function hideTip(){ document.getElementById('spark-tip').style.display='none'; }
</script>
